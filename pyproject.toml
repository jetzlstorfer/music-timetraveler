[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app", "database"]

[tool.pytest.ini_options]
testpaths = ["test_app.py"]
python_files = "test_*.py"
